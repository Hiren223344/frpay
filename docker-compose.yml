version: "3.8"

# Local dev dependencies only. Frenix Pay itself is meant to run as its
# own process on the VPS (systemd, or `docker build` a slim image from
# the binary), not necessarily through this compose file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frenixpay
      POSTGRES_PASSWORD: frenixpay
      POSTGRES_DB: frenixpay
    ports:
      - "5432:5432"
    volumes:
      - frenixpay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frenixpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frenixpay_postgres_data:
